    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0px 20px 0px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11pt;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 25px 10px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-top: 0;
            color: var(--primary);
        }

   /* ---------- NOVI CONTROL PANEL ---------- */
    .control-panel {
        height: 35px;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: nowrap;
        overflow-x: auto;
        background: var(--text);
        color: #ffffff;
        padding: 5px 8px;
        border-radius: 0;
        margin: -25px -25px 5px -25px;   /* edge-to-edge unutar containera */
        font-size: 1rem;
        font-family: 'Roboto Condensed', 'Segoe UI', Tahoma, sans-serif;
        -webkit-overflow-scrolling: touch;
    }

    .control-panel .cp-label {
        white-space: nowrap;
        font-weight: 600;
        flex-shrink: 0;
    }

    .control-panel select {
        height: 100%;
        background: #1e293b;
        color: #ffffff;
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 3px 4px;
        font-size: 1.2em;
        font-family: inherit;
        /*max-width: 130px;
        flex-shrink: 1;*/
        flex: 1 1 auto;   /* popuni preostali raspoloživi prostor u retku */
    }

    /* toggle kao tipka koja mijenja boju prema stanju */
    .toggle-btn {
        height: 100%;
      
        white-space: nowrap;
        font-size: 0.9em;
        font-family: inherit;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #1e293b;
        color: #94a3b8;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .toggle-btn.active {
        background: #475569;
        border-color: #677b98;
        color: #ffffff;
    }

    .control-panel .btn-primary {
        flex: 1 1 auto;   /* popuni preostali raspoloživi prostor u retku */
        padding: 0px;
				margin: 0px;
        font-size: 1.5rem;
				font-weight: bold;
        line-height: 1;
        white-space: nowrap;
        text-align: center;
        height: 100%;
    }
    /* ---------- KRAJ NOVOG CONTROL PANELA ---------- */

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            background: #f1f5f9;

        select {
            padding: 10px 0 10px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
        }
        
        button, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 237, 0.2);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            flex-grow: 1;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 330px;
            margin-bottom: 0px;
        }

        .ostali-grafovi-red {
            display: none;
            width: 100%;
            gap: 0px;
            margin-bottom: 5px;
        }
        .mini-chart-container {
            position: relative;
            width: calc(50% - 1px);
            height: 155px;
        }
        
        .pitanje-grafovi-red {
            display: none;
            width: 100%;
            gap: 0px;
            margin-bottom: 5px;
        }
        
        .pitanje-graf-container {
            position: relative;
            width: calc(25% - 1px);
            height: 100%;
        }

        .question-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 5px 10px 5px 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 60px;
						align-content: center;
        }

        .interaction-box {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .feedback-container {
            display: flex;
            gap: 6px;
            padding: 0;
            margin: 0;
            margin-bottom: 8px;
        }
        
        .shalabahterBtn {
            background-color: #ffffff;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.5em;
            transition: background 0.2s;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .shalabahterOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
         /* This box sizes to the image, not the screen */
        .shalabahterOverlay-content {
            display: inline-block;   /* shrink-wraps to content */
            padding: 16px;           /* space between image and box edge */
            margin: 24px;            /* space between box and viewport edge */
            background: white;
            border-radius: 8px;      /* optional styling */
            border: 2px solid #555;
            box-sizing: border-box;
            max-width: calc(100vw - 48px);   /* 100vw minus 2x margin */
            max-height: calc(100vh - 48px);  /* 100vh minus 2x margin */
        }

        .shalabahterOverlay-content img {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 48px - 32px); /* account for margin + padding */
            
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: pointer;
        }
        

        .shalabahterOverlay.active {
            display: flex;
        }

        
        .feedback {
            padding: 8px 0 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.4em;
            display: block;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Pushes arrows to edges, keeps text centered */
            box-sizing: border-box;
        }

        .feedback.correct {
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .feedback.hint {
            background-color: #FFF9E5;
            color: #FFD747;
            border: 1px solid #FFD747;
        }
        
        /* Arrow styling */
        #feedbackBox .arrow {
            /*font-size: 1.2rem;*/
            font-weight: bold;
            line-height: 1;
        }
        
        .explanation {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 13px;
            border-radius: 8px;
            display: flow-root;
            line-height: 1.6;
        }

        .explanation h3 {
            margin-top: 0;
            color: var(--text);
        }

        .nefizikalno {
            margin: 15px;
            color: #666666;
            font-style: italic;
            font-size: 0.8rem;
        }
        
        .hidden {
            display: none !important;
        }

        .highlight-blue { color: #2563eb; font-weight: bold; }
        .highlight-red { color: #dc2626; font-weight: bold; }

        .ubrzano { color: #FF00FF; font-weight: 600; }
        .usporeno { color: #00BD68; font-weight: 600; }
        .naprijed { color: blue; font-weight: 600; }
        .unazad { color: red; font-weight: 600; }
        .naprijedVT { color: blue; font-weight: 600; background: #DEE0FC; }
        .unazadVT { color: red; font-weight: 600; background: #F9D8D9; }
        .jednoliko { color: #00B9B9; font-weight: 600; }
        .mirovanje { color: #F9904E; font-weight: 600; }
        .strelica { color: #FACC00; font-weight: 600; }
        .dx { color: #3677EA; font-weight: 600; }
        .dy { color: #EA3F36; font-weight: 600; }

/* Stilovi za simulaciju gibanja */

 
        /* --- Scena: sve slojeve stavlja jedan iznad drugog --- */
        .gib-scena {
            position: relative;
            width: 100%;
            overflow: hidden; /* reže brzinomjer koji viri ispod donjeg ruba */
            border-radius: 8px;
            line-height: 0; /* uklanja whitespace ispod inline slike */
            margin-top: 10px;
        }

        /* Sloj 1: pozadinska slika (cesta, nebo, drveće u daljini...) - određuje visinu scene */
        .gib-pozadina-slika {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Sloj 2: vozilo + strelica smjera kretanja, poravnat preko cijele scene */
        .gib-vozilo-sloj {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .gib-auto {
            position: absolute;
            
            left: 0%; /* mijenja se JS-om */
            height: 20%; /* postotak visine pozadinske slike */
            width: auto;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: top 0.4s ease;
        }

        .papir-traka {
            position: relative;
            width: 100%;
            height: 20px;
            margin-top: 5px;
            margin-bottom: 5px;
            background: white;
            box-shadow: 0 0px 8px rgba(0, 0, 0, 0.9);
        }
        
        .tockica-gibanja {
            position: absolute;
            top: 75%; /* Gornja (25%) ili donja (75%) traka, ovisno o smjeru u trenutku ostavljanja */
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background-color: #000;
            transform: translate(-50%, -50%);
        }
        
        .papir-polozaj {
            position: absolute;
            top: 0%;
            width: 2px;
            height: 100%;
            background-color: #F00;
            opacity: 0.2;
        }

        /* Sloj 3: prednji plan (PNG s prozirnošću - grmlje, ograde i sl. ispred ceste) */
        .gib-prednji-plan-slika {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Sloj 4: brzinomjer, iznad svega, dijelom odrezan donjim rubom scene, autoskalira se */
        .gib-brzinomjer {
            position: absolute;
            left: 0%; /* mijenja se JS-om, sinkrono s autom */
            bottom: -11%; /* dio kruga ispod ruba scene */
            height: 25%; /* postotak visine pozadinske slike */
            aspect-ratio: 1 / 1;
            transform: translateX(-50%);
            border-radius: 50%;
            background-color: #000;
            border: 0px solid #fff;
            box-shadow: 0 1px 4px rgba(255, 255, 255, 0.2);
            z-index: 4;
            /*transition: left 0.15s ease;*/
        }
        .gib-brzinomjer svg {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #gibBrzinomjerKazaljka {
            transition: x2 0.05s linear, y2 0.05s linear;
        }
 
        .gib-strelica-smjera {
            position: absolute;
            top: var(--gib-cesta-pozicija);
            left: 0%; /* mijenja se JS-om, sinkrono s autom */
            height: 12%; /* postotak visine pozadinske slike, autoskalira se */
            width: auto;
            aspect-ratio: 10 / 1; /* odgovara viewBox-u 200x20 */
            transform: translate(-50%, -50%);
            overflow: visible;
            pointer-events: none;
            z-index: 1; /* ispod auta */
            transition: top 0.15s ease;
            opacity: 0;
        }
        .strelica-akceleracije {
            position: absolute;
            top: 50%; /* Ovo ćemo mijenjati JS-om, isto kao i auto */
            left: 0%; /* Ovo ćemo mijenjati JS-om, isto kao i auto */
            width: 200px;
            height: 20px;
            transform: translate(-50%, -50%);
            overflow: visible;
            pointer-events: none;
            z-index: 1; /* Iznad ceste/točkica, ispod auta */
            transition: top 0.15s ease;
        }
        
        
       
/* SVG ikone */
        
        .svg-column {
            float: right;
            width: 200px;           /* Sets equal width for all SVGs */
            margin-left: 20px;      /* Space between text and images */
            margin-bottom: 10px;    /* Space below images for wrapping text */
            display: flex;
            flex-direction: column; /* Stacks images vertically in a single column */
            gap: 15px;              /* Space between individual SVGs */
            position: relative;
        }
        
        .svg-column-mobile {
            float: right;
            width: 130px;           /* Sets equal width for all SVGs */
            margin-left: 5px;      /* Space between text and images */
            margin-bottom: 10px;    /* Space below images for wrapping text */
            display: flex;
            flex-direction: column; /* Stacks images vertically in a single column */
            gap: 15px;              /* Space between individual SVGs */
            position: relative;
        }


        /* Ensures SVGs scale properly within the set column width */
        .svg-column img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .svg-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;                     /* Covers half the container width */
            background-color: #F8FAFC;     /* Background color */
            opacity: 0.7;                  /* transparency */
            pointer-events: none;          /* Allows clicks to pass through to images */
            z-index: 10;                   /* Keeps overlay on top of images */
        }

        /* Position options */
        .svg-overlay-left {
            left: 0;
        }

        .svg-overlay-right {
            right: 0;
        } 

        .hint-overlay {
            position: absolute;
            width: 180px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 10px;
            transform: translateX(-50%);
            
            /* Flex layout to stack SVGs in a single column */
            display: flex;
            flex-direction: column;
            gap: 10px;
            
            z-index: 1000;
            cursor: pointer;
            box-sizing: border-box;
        }

            /* Ensure child SVGs fill the 150px container width */
        .hint-overlay img {
            width: 100%;
            height: auto;
            display: block;
        }

function getYAtT(faze, t) {
    let f = faze.find(f => t >= f.t0 && t <= f.t1);
    if (!f) f = faze[2]; 
    if (f.t0 === f.t1) return f.y0; 
    return f.y0 + ((f.y1 - f.y0) / (f.t1 - f.t0)) * (t - f.t0);
}

// POMOČNE FUNKCIJE ZA GENERIRANJE ZADATAKA

function generirajSiroveFaze(trajanja, vrstaGrafa, gradivo, tezina) {
    let tTrenutno = 0;
    let yTrenutno;

    // Početna vrijednost y-a ovisi o tipu grafa:
    // - s/t: nasumičan početni položaj (parni brojevi 0-8)
    // - v/t (osim jednolikog): nasumična početna brzina, 50% šanse da je 0
    // - ostalo (v/t+jednoliko, a/t): kreće od 0
    if (vrstaGrafa === 's/t') {
        yTrenutno = Math.floor(Math.random() * 5) * 2;
    } else if (vrstaGrafa === 'v/t' && gradivo !== 'jednoliko') {
        yTrenutno = (Math.random() < 0.5) ? 0 : (Math.floor(Math.random() * 9) - 2);
    } else {
        yTrenutno = Math.floor(Math.random()*5)-2;
    }

    // Za v/t + jednoliko: u 70% slučajeva forsiraj jednu pozitivnu, jednu negativnu
    // i jednu nultu brzinu (u nasumičnom redoslijedu), da vježba pokrije sve slučajeve.
    let jednolikeBrzine = null;
    if (vrstaGrafa === 'v/t' && gradivo === 'jednoliko' && Math.random() < 0.7) {
        const pozitivna = Math.floor(Math.random() * 4) + 1;
        const negativna = -(Math.floor(Math.random() * 4) + 1);
        jednolikeBrzine = [pozitivna, negativna, 0].sort(() => Math.random() - 0.5);
    }

    let faze = [];
    let isDobar = true; // postaje false ako neka faza prekrši pravilo "nema prelaska preko nule"

    // Generiraj y0/y1 za svaku od 3 faze, prema tipu grafa
    for (let i = 0; i < 3; i++) {
        let dt = trajanja[i];
        let tKraj = tTrenutno + dt;
        let yKraj = 0;

        if (vrstaGrafa === 's/t') {
            // s/t: svaka faza je jednoliko gibanje - nasumična brzina v, pomak = v*dt
            let v = Math.floor(Math.random() * 13) - 6;
            if (gradivo === 'jednoliko' && v === 0 && i === 1) v = 1; // izbjegni "mirovanje" u srednjoj fazi kod jednolikog
            yKraj = yTrenutno + (v * dt);
        }
        else if (vrstaGrafa === 'v/t' || vrstaGrafa === 's/t-krivo') {
            // s/t-krivo se generira identično kao v/t (y0/y1 ovdje predstavljaju BRZINU,
            // stvarni - eventualno zakrivljeni - položaj računa se kasnije iz kinematike)
            if (gradivo === 'jednoliko') {
                // jednoliko v/t: svaka faza ima konstantnu brzinu (vodoravna linija)
                let v;
                if (jednolikeBrzine) {
                    v = jednolikeBrzine[i];
                } else {
                    v = Math.floor(Math.random() * 9) - 4;
                    if (v === yTrenutno) v += 1; // izbjegni identičnu brzinu kao prethodna faza
                }
                yTrenutno = v;
                yKraj = v;
            } else {
                // sva gibanja: nasumična akceleracija a, brzina se linearno mijenja unutar faze
                let a = Math.floor(Math.random() * 5) - 2;
                if (tezina === 5) {
                    a = Math.floor(Math.random() * 2); // za težinu 5 akceleracija je uvijek >= 0
                    if (yTrenutno === 0 && a === 0) a = 2;
                }
                yKraj = yTrenutno + (a * dt);

                // Zabrana prelaska brzine preko nule usred faze - potrebno kad se pita
                // za vrstu/smjer gibanja (0/7) ili računa površina/pomak (5), gdje
                // predznak brzine mora biti jednoznačan unutar cijelog segmenta.
                if ((tezina === 0 || tezina === 5) && yTrenutno * yKraj < 0) isDobar = false;
            }
        }
        else if (vrstaGrafa === 'a/t') {
            // a/t: svaka faza ima konstantnu (nasumičnu) akceleraciju - "step" graf
            let a = Math.floor(Math.random() * 5) - 2;
            yTrenutno = a;
            yKraj = a;
        }

        faze.push({ t0: tTrenutno, t1: tKraj, y0: yTrenutno, y1: yKraj });
        tTrenutno = tKraj;
        yTrenutno = yKraj;
    }

    return { faze, isDobar };
}

function provjeriZanimljivost(faze, vrstaGrafa, gradivo, tezina) {
    // Težina 3 (traži se faza s najvećim nagibom): nagib mora biti jednoznačno najveći,
    // dakle nijedna druga faza ne smije imati (skoro) isti maksimalni nagib.
    if (tezina === 3) {
        const iznosiNagiba = faze.map(f => Math.abs((f.y1 - f.y0) / (f.t1 - f.t0)));
        const maxNagib = Math.max(...iznosiNagiba);
        const brojMaksimalnih = iznosiNagiba.filter(n => n === maxNagib).length;
        if (brojMaksimalnih > 1) return false;
    }

    // Osiguraj da graf nije "dosadan": nijedna dva segmenta ne smiju imati jednak
    // nagib (s/t, v/t+sva) odnosno jednaku vrijednost (v/t+jednoliko, a/t).
    if (vrstaGrafa === 's/t') {
        // s/t: uspoređuju se nagibi (brzine) segmenata
        const nagibi = faze.map(f => (f.y1 - f.y0) / (f.t1 - f.t0));
        for (let i = 0; i < nagibi.length; i++)
            for (let j = i + 1; j < nagibi.length; j++)
                if (Math.abs(nagibi[i] - nagibi[j]) < 1e-9) return false;
    } else if (vrstaGrafa === 'v/t' || vrstaGrafa === 's/t-krivo') {
        if (gradivo === 'jednoliko') {
            // vodoravni segmenti - uspoređuju se same (konstantne) vrijednosti brzine
            const vrijednosti = faze.map(f => f.y0);
            for (let i = 0; i < vrijednosti.length; i++)
                for (let j = i + 1; j < vrijednosti.length; j++)
                    if (Math.abs(vrijednosti[i] - vrijednosti[j]) < 1e-9) return false;
        } else {
            // kose linije - uspoređuju se nagibi (akceleracije) segmenata
            const nagibi = faze.map(f => (f.y1 - f.y0) / (f.t1 - f.t0));
            for (let i = 0; i < nagibi.length; i++)
                for (let j = i + 1; j < nagibi.length; j++)
                    if (Math.abs(nagibi[i] - nagibi[j]) < 1e-9) return false;
        }
    } else if (vrstaGrafa === 'a/t') {
        // a/t: uspoređuju se same vrijednosti akceleracije po fazi
        const akceleracije = faze.map(f => f.y0);
        for (let i = 0; i < akceleracije.length; i++)
            for (let j = i + 1; j < akceleracije.length; j++)
                if (Math.abs(akceleracije[i] - akceleracije[j]) < 1e-9) return false;
    }

    return true;
}

function izracunajKinematikuZaFaze(faze, vrstaGrafa) {
    let trenutniS = 0;
    let trenutniV = 0;

    // Za a/t graf brzina nije zadana izravno - biramo početnu brzinu tako da
    // najniža relativna brzina tijekom gibanja ispadne 0, 1 ili 2 m/s (nasumično),
    // kako simulacija ne bi imala "nemoguće" (npr. jako negativne) brzine.
    if (vrstaGrafa === 'a/t') {
        let relV = 0, minV = 0;
        faze.forEach(f => {
            relV += f.y0 * (f.t1 - f.t0);
            if (relV < minV) minV = relV;
        });
        let targetMinV = (Math.random() < 0.3) ? 0 : Math.floor(Math.random() * 3) + 1;
        trenutniV = targetMinV - minV;
    }

    // Za svaku fazu izračunaj v0, a i s1 na temelju tipa grafa, te akumuliraj položaj (s)
    faze.forEach((f) => {
        let a, v0;
        let dt = f.t1 - f.t0;
        if (vrstaGrafa === 's/t') {
            // s/t graf izravno diktira položaj; akceleracija je 0, brzina = nagib segmenta
            a = 0;
            v0 = (f.y1 - f.y0) / dt;
            trenutniS = f.y0;
        } else if (vrstaGrafa === 'v/t' || vrstaGrafa === 's/t-krivo') {
            // v/t (i s/t-krivo, koji se generira kao v/t): akceleracija = nagib, v0 = y0
            a = (f.y1 - f.y0) / dt;
            v0 = f.y0;
        } else if (vrstaGrafa === 'a/t') {
            // a/t: akceleracija je zadana (y0), brzina se nadovezuje iz prethodne faze
            a = f.y0;
            v0 = trenutniV;
            trenutniV = v0 + a * dt;
        }

        // s1 po formuli s0 + v0*t + 1/2*a*t^2 - ovo je "prava" (eventualno zakrivljena) putanja
        f.kinematika = { s0: trenutniS, v0: v0, a: a, s1: trenutniS + v0 * dt + 0.5 * a * (dt * dt) };
        trenutniS = f.kinematika.s1; // položaj na kraju faze postaje početak sljedeće
    });
}

function provjeriValjanostKinematike(faze, vrstaGrafa, tezina, provjeriCitljivost = true) {
    // Najviše jedna faza smije biti "mirovanje" (brzina i akceleracija cijelo vrijeme 0)
    const brojMirovanja = faze.filter(f => Math.abs(f.kinematika.v0) < 1e-9 && Math.abs(f.kinematika.a) < 1e-9).length;
    if (brojMirovanja > 1) return false;

    // a/t + težina 0: brzina ne smije mijenjati predznak unutar jedne faze, inače
    // vrsta/smjer gibanja ondje ne bi bili jednoznačno određeni.
    if (vrstaGrafa === 'a/t' && tezina === 0) {
        for (const f of faze) {
            const dt = f.t1 - f.t0;
            const v1 = f.kinematika.v0 + f.kinematika.a * dt;
            if (f.kinematika.v0 * v1 < 0) return false;
        }
    }

    // s/t-krivo: svaki segment mora biti dovoljno "čitljiv" (dovoljno dug s obzirom
    // na akceleraciju) da se zakrivljenost vizualno primijeti na grafu.
    if (provjeriCitljivost && vrstaGrafa === 's/t-krivo') {
        for (const f of faze) {
            const dt = f.t1 - f.t0;
            const aAbs = Math.abs(f.kinematika.a);
            if (!((dt >= 3) || (dt >= 2 && aAbs >= 2))) return false;
        }
    }

    return true;
}



// POMOČNE FUNKCIJE ZA GENERIRANJE DOBRIH GRAFOVA KANDIDATA
// (razina 6)

const EPS = 1e-9;
const TOLERANCIJA_RANGA = 0.4; // relativna tolerancija: iznosi unutar ovog postotka smatraju se "praktički jednakima" (isti rang)

// Računa potpis SVAKE faze u nizu, uzimajući u obzir tip grafa. razina3 kod
// v/t, a/t i s/t je RELATIVNI RANG iznosa (0,1,2...) unutar OVOG grafa,
// ne apsolutna vrijednost - bitan je samo redoslijed/omjer, nikad točna razlika.
// Kod s/t-krivo razina3 ostaje predznak zakrivljenosti (gore/dolje).
function izracunajPotpiseZaGraf(faze, tipGrafa) {
    if (tipGrafa === 's/t-krivo') {
        return faze.map(f => {
            const v0 = f.kinematika.v0, a = f.kinematika.a;
            const miruje = Math.abs(v0) < EPS && Math.abs(a) < EPS;
            const smjer = Math.abs(v0) >= EPS ? Math.sign(v0) : (Math.abs(a) >= EPS ? Math.sign(a) : 0);
            return {
                razina1: miruje ? 'vodoravno' : 'koso',
                razina2: miruje ? null : smjer,
                razina3: miruje ? null : (Math.abs(a) < EPS ? 0 : Math.sign(a))
            };
        });
    }

    // v/t, a/t, s/t: prvo razina1/razina2 po fazi, plus "sirovi" iznos za rangiranje
    const sirovi = faze.map(f => {
        const vrijednost = (tipGrafa === 'a/t') ? f.kinematika.a : f.kinematika.v0; // v/t i s/t oboje preko v0
        const naNuli = Math.abs(vrijednost) < EPS;
        return {
            razina1: naNuli ? (tipGrafa === 's/t' ? 'vodoravno' : 'nula') : (tipGrafa === 's/t' ? 'koso' : 'izvan-nule'),
            razina2: naNuli ? null : Math.sign(vrijednost),
            iznos: naNuli ? null : Math.abs(vrijednost),
            razina3: null
        };
    });

    // Dodijeli rang (0,1,2...) po iznosu, grupirajući bliske vrijednosti u isti rang
    const indeksiZaRang = sirovi.map((s, i) => i).filter(i => sirovi[i].iznos !== null);
    indeksiZaRang.sort((a, b) => sirovi[a].iznos - sirovi[b].iznos);
    let trenutniRang = 0;
    indeksiZaRang.forEach((idx, k) => {
        if (k > 0) {
            const prevIdx = indeksiZaRang[k - 1];
            const razlika = Math.abs(sirovi[idx].iznos - sirovi[prevIdx].iznos);
            const referenca = Math.max(sirovi[idx].iznos, sirovi[prevIdx].iznos, EPS);
            if (razlika / referenca > TOLERANCIJA_RANGA) trenutniRang++;
        }
        sirovi[idx].razina3 = trenutniRang;
    });

    return sirovi.map(({ razina1, razina2, razina3 }) => ({ razina1, razina2, razina3 }));
}

function usporediPotpise(fazeA, fazeB, tipGrafa) {
    const potpisiA = izracunajPotpiseZaGraf(fazeA, tipGrafa);
    const potpisiB = izracunajPotpiseZaGraf(fazeB, tipGrafa);

    for (let razina = 1; razina <= 3; razina++) {
        const kljuc = 'razina' + razina;
        for (let i = 0; i < potpisiA.length; i++) {
            const va = potpisiA[i][kljuc];
            const vb = potpisiB[i][kljuc];
            if (va === null && vb === null) continue;
            if (va !== vb) return razina;
        }
    }
    return null;
}

    // pa ovo radimo samo za ostale razine gdje je točan odgovor broj:
    if (tezina !== 0 && tezina !== 6) {
        zadatak.tocanOdgovor = tocanOdgovor;
    }

    // Postavljanje ispravne mjerne jedinice pored inputa
    let jedinicaText = "";
    if (tezina === 1) {

        else jedinicaText = yJedinica;

        if (vrstaGrafa === 's/t') jedinicaText = 'm';
        else if (vrstaGrafa === 'v/t' && zadatak.gradivo === 'jednoliko') jedinicaText = 's';
        else if (vrstaGrafa === 'v/t') jedinicaText = 'm/s';
        else jedinicaText = 's';
    } 
    else if (tezina === 3) jedinicaText = ""; // Samo broj faze
    else if (tezina === 4) jedinicaText = (vrstaGrafa === 's/t') ? 'm/s' : 'm/s²';
    else if (tezina === 5) jedinicaText = (vrstaGrafa === 'v/t') ? 'm' : 'm/s';
    else if (tezina === 6) jedinicaText = ""; // Samo redni broj grafa
    
    mjernaJedinica.textContent = jedinicaText;
    tekstPitanja.innerHTML = `${tekst}`;
    
}

function odbaceni(broj) {
    const grafovi = [];

    trenutniZadatak.kandidati.forEach((kandidat, index) => {
        if (kandidat.razinaOdbacivanja === broj) {
            grafovi.push(index + 1); // želimo numeraciju od 1 do 4
        }
    });

    if (grafovi.length === 0) {
        return "<p>";
    }

    if (grafovi.length === 1) {
        return `<br>Na ovaj smo način mogli odbaciti graf <b>${grafovi[0]}</b>.<p>`;
    }

    const zadnji = grafovi.pop();
    return `<br>Na ovaj smo način mogli odbaciti grafove <b>${grafovi.join("</b>, <b>")}</b> i <b>${zadnji}</b>.<p>`;
}

    
function provjeriOdgovor() {
    btnProvjeri.disabled = true;
    btnProvjeri.classList.add('hidden');
    btnDalje.classList.remove('hidden');
    //btnOstaliGrafovi.style.display = 'block';

    danOdgovor = 1;
    prikaziOstaleGrafove();
    if(trenutniZadatak.tezina === 6) prikaziKandidateGrafova(trenutniZadatak);
   
    let isCorrect = false;

    isSimulacijaAktivna = true;
    
    pokreniAnimaciju();
    
    // Provjera ako smo na nultoj vještini (prepoznavanje)
    if (trenutniZadatak.tezina === 0) {
        const odabranaVrsta = selectVrsta.value;
        const odabraniSmjer = selectSmjer.value;

        selectVrsta.disabled = true;
        selectSmjer.disabled = true;

        const tocanV = trenutniZadatak.tocanOdgovor.vrsta;
        const tocanS = trenutniZadatak.tocanOdgovor.smjer;

        isCorrect = (odabranaVrsta === tocanV && odabraniSmjer === tocanS);

    } else {
        // Standardna provjera za matematički unos (zadatci 1-5,7)
        const unos = parseFloat(inputOdgovor.value);

        inputOdgovor.disabled = true;
        isCorrect = !isNaN(unos) && (Math.abs(unos - trenutniZadatak.tocanOdgovor) < 0.01);
    }

    // Prikaz povratne informacije
    if (isCorrect) {
        feedbackBox.textContent = "Bravo! To je točan odgovor!";
        feedbackBox.className = "feedback correct";
        feedbackBox.style.display = "block";
        feedbackBox.style.visibility = 'visible';
        btnDalje.style.background = "#16a34a";
        nivo++;
    } else {
        //feedbackBox.innerHTML = `Netočno.`;
        feedbackBox.innerHTML = "";
        feedbackBox.className = "feedback incorrect";
        feedbackBox.style.display = "block";
        feedbackBox.style.visibility = 'visible';
        btnDalje.style.background = "#dc2626";
        
        let tocno = "";
        
        if (trenutniZadatak.tezina !== 0) {   // izmijenjeno 6->7
            tocno = `<span style="font-size: 0.8em">Točan odgovor je</span> <b>${trenutniZadatak.tocanOdgovor}</b> ${mjernaJedinica.textContent}`;
        } else {
            let sm = trenutniZadatak.tocanOdgovor.smjer;
            let vrstaText = "";
            let tocanVrsta = trenutniZadatak.tocanOdgovor.vrsta;
            if(tocanVrsta === 'ubrzano') vrstaText = 'jednoliko ubrzano';
            else if(tocanVrsta === 'usporeno') vrstaText = 'jednoliko usporeno';
            else if(tocanVrsta === 'jednoliko') vrstaText = 'jednoliko gibanje';
            else vrstaText = 'mirovanje';
            if(sm === "nepoznat") { sm = ""; }
            tocno = `<span style="font-size: 0.8em">${vrstaText} ${sm}</span>`;
        }

        feedbackBox.innerHTML = `<span class="arrow">&#x2193;</span><span class="text" style="width: 80%;display: inline-block;">${tocno}</span><span class="arrow">&#x2193;</span>`;
        
        // Osvježi graf s vizualnim pojašnjenjima (ako postoje)
        if (trenutniZadatak.pomocData) {
            vizualnaPomocState = trenutniZadatak.pomocData;
            chartInstance.update(); 
        }

        const imgTags = svgs.map(name => `<img src="svg/${name}.svg" alt="${name}" />`).join('\n  ');
        let overlay='';
        if (svgHide !== '')  overlay = `<div class="svg-overlay svg-overlay-${svgHide}"></div>`;
        if (isMobile) {
            const svgBox = `<div class="svg-column-mobile">${overlay}${imgTags}</div>`;
            explanationBox.innerHTML = `${svgBox}${trenutniZadatak.tekstObjasnjena}`;
        } else {
            const svgBox = `<div class="svg-column">${overlay}${imgTags}</div>`;
            explanationBox.innerHTML = `${svgBox}<h3>Objašnjenje zadatka:</h3>${trenutniZadatak.tekstObjasnjena}`;
        }
        explanationBox.style.display = "flow-root";
    }
}

// Pomoćna funkcija za crtanje "mješovitog" teksta na canvasu - dio teksta u kurzivu
// (oznake fizikalnih veličina s, v, a, t), a dio uspravno (mjerne jedinice, brojevi...).
// dijelovi: [{t: 'tekst', i: true/false}, ...]; poravnanje: 'left' | 'center' | 'right'.
function nacrtajDijeloveTeksta(ctx, dijelovi, x, y, fontBazni, poravnanje) {
    poravnanje = poravnanje || 'left';
    const sirine = dijelovi.map(d => {
        ctx.font = (d.i ? 'italic ' : '') + fontBazni;
        return ctx.measureText(d.t).width;
    });
    const ukupno = sirine.reduce((a, b) => a + b, 0);

    let cx;
    if (poravnanje === 'center') cx = x - ukupno / 2;
    else if (poravnanje === 'right') cx = x - ukupno;
    else cx = x;

    const staroPoravnanje = ctx.textAlign;
    ctx.textAlign = 'left';
    dijelovi.forEach((d, idx) => {
        ctx.font = (d.i ? 'italic ' : '') + fontBazni;
        ctx.fillText(d.t, cx, y);
        cx += sirine[idx];
    });
    ctx.textAlign = staroPoravnanje;
}

// --- CHART.JS PLUGIN: ŠKOLSKE OSI ---
const skolskaOsPlugin = {
    id: 'skolskaOs',
    beforeDraw: (chart) => {
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;

        ctx.save();
        const yNula = yAxis.getPixelForValue(0);
        const xNula = xAxis.getPixelForValue(0);

        ctx.strokeStyle = (DM ? '#ffffff' : '#000000');
        ctx.lineWidth = 2;

        // X-os i Y-os
        ctx.beginPath();
        ctx.moveTo(xAxis.left, yNula);
        ctx.lineTo(xAxis.right + 15, yNula);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(xNula, yAxis.bottom);
        ctx.lineTo(xNula, yAxis.top - 15);
        ctx.stroke();

        ctx.fillStyle = (DM ? '#ffffff' : '#000000');
        // Strelice
        ctx.beginPath();
        ctx.moveTo(xAxis.right + 20, yNula);
        ctx.lineTo(xAxis.right + 10, yNula - 5);
        ctx.lineTo(xAxis.right + 10, yNula + 5);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(xNula, yAxis.top - 20);
        ctx.lineTo(xNula - 5, yAxis.top - 10);
        ctx.lineTo(xNula + 5, yAxis.top - 10);
        ctx.fill();

        // Oznake
        ctx.fillStyle = (DM ? '#ffffff' : '#000000');
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        nacrtajDijeloveTeksta(ctx, [{ t: 't', i: true }, { t: ' (s)', i: false }], xAxis.right + 5, yNula - 15, 'bold 14px sans-serif', 'left');
        
        ctx.textBaseline = 'bottom';
        let simbolY = chart.options.plugins?.skolskaOs?.simbol;
        let jedinicaY = chart.options.plugins?.skolskaOs?.jedinica;
        if (!simbolY) {
            simbolY = 's'; jedinicaY = '(m)';
            if (trenutniZadatak && trenutniZadatak.vrstaGrafa === 'v/t') { simbolY = 'v'; jedinicaY = '(m/s)'; }
            if (trenutniZadatak && trenutniZadatak.vrstaGrafa === 'a/t') { simbolY = 'a'; jedinicaY = '(m/s²)'; }
        }
        // Oznaka veličine na y-osi: default iznad strelice (kao dosad), ili - ako je
        // postavljena opcija oznakaYuStranu - malo desno od vrha strelice.
        const kompaktan = chart.options.plugins?.skolskaOs?.kompaktan;
        if (kompaktan) {
            ctx.textBaseline = 'middle';
            nacrtajDijeloveTeksta(ctx, [{ t: simbolY, i: true }, { t: ' ' + jedinicaY, i: false }], xNula + 12, yAxis.top - 12, 'bold 14px sans-serif', 'left');
        } else {
            nacrtajDijeloveTeksta(ctx, [{ t: simbolY, i: true }, { t: ' ' + jedinicaY, i: false }], xNula + 0, yAxis.top - 20, 'bold 14px sans-serif', 'center');
        }
        
        //nacrtajDijeloveTeksta(ctx, [{ t: simbolY, i: true }, { t: ' ' + jedinicaY, i: false }], xNula + 0, yAxis.top - 20, 'bold 14px sans-serif', 'center');

        // Brojevi X-osi
        ctx.fillStyle = (DM ? '#ffffff' : '#000000');
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        xAxis.ticks.forEach(tick => {
            const xPos = xAxis.getPixelForValue(tick.value);
            if (tick.value > 0) { 
                ctx.fillText(tick.value, xPos, yNula + 8);
                ctx.beginPath();
                ctx.moveTo(xPos, yNula - 4);
                ctx.lineTo(xPos, yNula + 4);
                ctx.strokeStyle = (DM ? '#ffffff' : '#000000');
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        });

        
        // Dodatni tekst u sredini grafa (ako je definiran)
        const tekstSredina = chart.options.plugins?.skolskaOs?.tekstSredina;
        if (tekstSredina) {
            const { left, right, top, bottom } = chart.chartArea;
            const xCentar = (left + right) / 2;
            const yCentar = (top + bottom) / 2;

            //ctx.fillStyle = (DM ? '#ffffff' : '#000000'); // Boja teksta
            ctx.fillStyle = chart.options.plugins?.skolskaOs?.bojaTekstaSredina || '#ef4444';
            ctx.font = 'bold 16px sans-serif'; // Font po želji
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const linije = tekstSredina.split('\n');
            const visinaReda = 20; // Prilagodite veličini fonta
        
            // Izračun početnog Y tako da je sredina svih redova u točki 'y'
            const pocetniY = yCentar - ((linije.length - 1) * visinaReda) / 2;

            linije.forEach((linija, i) => {
                ctx.fillText(linija, xCentar, pocetniY + (i * visinaReda));
            });
            
            //ctx.fillText(tekstSredina, xCentar, yCentar);
        }
        
        const tekstDno = chart.options.plugins?.skolskaOs?.tekstDno; // ili tekstDno
        if (tekstDno) {
            const { left, right, bottom } = chart.chartArea;
            const xCentar = (left + right) / 2;
            const yDno = bottom + 15; // -5px odmak od samog dna radi boljeg izgleda

            ctx.fillStyle = chart.options.plugins?.skolskaOs?.bojaTekstaSredina || '#ef4444';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom'; // Poravnava dno slova s yDno koordinatom
            ctx.fillText(tekstDno, right, 15);
        }
        
        ctx.restore();
    }

};

            const xCentar = (left + right) / 2;
            const yCentar = (top + bottom) / 2;

            let boja = '#002ab345';
            
            if(danOdgovor) {
                if(broj == trenutniZadatak.tocanOdgovor) boja = '#16A34A';
                else if(broj == inputOdgovor.value) boja = '#DC2626';
            }
            
            //ctx.fillStyle = (DM ? '#ffffff' : '#000000'); // Boja teksta
            ctx.fillStyle = boja;
            ctx.font = 'bold 40px sans-serif'; // Font po želji
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(broj, xCentar, top-20);
    
        }
        
        ctx.restore();
    }

};


// --- CHART.JS PLUGIN: VIZUALNA POJAŠNJENJA ---
const vizualniAsistentPlugin = {
    id: 'vizualniAsistent',
    afterDraw: (chart) => {
    
    
        nacrtajOznakeFaza(chart); 
        if (!vizualnaPomocState) return;
        
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;
        const state = vizualnaPomocState;

        ctx.save();

        
        // Lako podesivi izgled diskova s vrijednostima
        const DISK_OFFSET = 18;   // udaljenost diska od linije strelice (px)
        const DISK_RADIUS = 12;   // polumjer diska (px)

        function crtajStrelicu(x1, y1, x2, y2, boja, dijeloviTeksta = null, vrijednosti = null) {
            if(x1 !== x2 || y1 !== y2) {
                ctx.beginPath();
                let y2short = y2 === y1 ? y2 : y2 > y1 ? y2 - 10 : y2 + 10;
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2-(y1 === y2 ? 10 : 0), y2short);
                ctx.strokeStyle = boja;
                ctx.lineWidth = 8;
                ctx.stroke();
                const kut = Math.atan2(y2 - y1, x2 - x1);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - 20 * Math.cos(kut - Math.PI / 6), y2 - 20 * Math.sin(kut - Math.PI / 6));
                ctx.lineTo(x2 - 20 * Math.cos(kut + Math.PI / 6), y2 - 20 * Math.sin(kut + Math.PI / 6));
                ctx.fillStyle = boja;
                ctx.fill();
            }

            const jeVertikalno = (Math.abs(x2 - x1) < Math.abs(y2 - y1)) || (y1 === y2 && x1 === x2);

            if (dijeloviTeksta) {
                ctx.fillStyle = boja;
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                ctx.save();
                ctx.translate(midX, midY);
                if (jeVertikalno) {
                    ctx.rotate(-Math.PI / 2);
                    ctx.fillStyle = '#ffffff';
                    for(let i=-1; i<=1; i++) { for (let j=-1; j<=1; j++) {
                        nacrtajDijeloveTeksta(ctx, dijeloviTeksta, 0-i, 20-j, 'bold 15px sans-serif', 'center'); }}
                    ctx.fillStyle = boja;
                    nacrtajDijeloveTeksta(ctx, dijeloviTeksta, 0, 20, 'bold 15px sans-serif', 'center');
                } else {
                    ctx.fillStyle = '#ffffff';
                    for(let i=-1; i<=1; i++) { for (let j=-1; j<=1; j++) {
                        nacrtajDijeloveTeksta(ctx, dijeloviTeksta, 0-i, -10-j, 'bold 15px sans-serif', 'center'); }}
                    ctx.fillStyle = boja;
                    nacrtajDijeloveTeksta(ctx, dijeloviTeksta, 0, -10, 'bold 15px sans-serif', 'center');
                }
                ctx.restore();
            }

            if (vrijednosti) {
                const { pocetna, krajnja } = vrijednosti;
                let pocX, pocY, krajX, krajY;

                if (jeVertikalno) {
                    // vertikalna strelica -> diskovi lijevo od nje
                    pocX = x1 - DISK_OFFSET; pocY = y1;
                    krajX = x2 - DISK_OFFSET; krajY = y2;
                } else {
                    // horizontalna strelica -> diskovi ispod nje
                    pocX = x1; pocY = y1 + DISK_OFFSET;
                    krajX = x2; krajY = y2 + DISK_OFFSET;
                }

                crtajDiskSVrijednosti(pocX, pocY, boja, '');
                crtajDiskSVrijednosti(krajX, krajY, boja, '');
                dopisiYVrijednost(pocX, pocY, boja, pocetna);
                dopisiYVrijednost(krajX, krajY, boja, krajnja);
            }
        }

        function crtajDiskSVrijednosti(x, y, boja, vrijednost) {
            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.arc(x, y, vrijednost ? vrijednost : DISK_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = boja;
            ctx.fill();
        }
        
        function dopisiYVrijednost(x,y,boja,vrijednost) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(vrijednost, x, y);
        }
        
        
        
        
        const yNula = yAxis.getPixelForValue(0);
        const xNula = xAxis.getPixelForValue(0);

        if (state.tip === 'ocitavanje') {
            ctx.setLineDash([6, 4]);
            ctx.lineWidth = 2;
            const xPixel = xAxis.getPixelForValue(state.xVal);
            const yPixel = yAxis.getPixelForValue(state.yVal);
            
            let yNula2 = yNula;
            if(state.yVal < 0) 
                yNula2 += 20;

            if (state.reverse) {
                ctx.beginPath(); ctx.moveTo(xNula, yPixel); ctx.lineTo(xPixel, yPixel); ctx.strokeStyle = '#2563eb'; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(xPixel, yPixel); ctx.lineTo(xPixel, yNula2); ctx.strokeStyle = '#dc2626'; ctx.stroke();
                ctx.setLineDash([]);
                crtajDiskSVrijednosti(xNula-DISK_OFFSET, yPixel, '#2563eb', '');
                crtajDiskSVrijednosti(xPixel, yNula+DISK_OFFSET, '#dc2626', '');
                dopisiYVrijednost(xNula-DISK_OFFSET, yPixel, 'white', state.yVal);
                dopisiYVrijednost(xPixel, yNula+DISK_OFFSET, 'white', state.xVal);
                //ctx.beginPath(); ctx.arc(xNula, yPixel, 6, 0, 2 * Math.PI); ctx.fillStyle = '#2563eb'; ctx.fill();
                //ctx.beginPath(); ctx.arc(xPixel, yNula, 6, 0, 2 * Math.PI); ctx.fillStyle = '#dc2626'; ctx.fill();
            } else {
                ctx.beginPath(); ctx.moveTo(xPixel, yNula2); ctx.lineTo(xPixel, yPixel); ctx.strokeStyle = '#2563eb'; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(xPixel, yPixel); ctx.lineTo(xNula, yPixel); ctx.strokeStyle = '#dc2626'; ctx.stroke();
                ctx.setLineDash([]);
                crtajDiskSVrijednosti(xNula-DISK_OFFSET, yPixel, '#dc2626', '');
                crtajDiskSVrijednosti(xPixel, yNula+DISK_OFFSET, '#2563eb', '');
                dopisiYVrijednost(xNula-DISK_OFFSET, yPixel, 'white', state.yVal);
                dopisiYVrijednost(xPixel, yNula+DISK_OFFSET, 'white', state.xVal);
                //ctx.beginPath(); ctx.arc(xPixel, yNula, 6, 0, 2 * Math.PI); ctx.fillStyle = '#2563eb'; ctx.fill();
                //ctx.beginPath(); ctx.arc(xNula, yPixel, 6, 0, 2 * Math.PI); ctx.fillStyle = '#dc2626'; ctx.fill();
            }
        }

        if (state.tip === 'nagib_ili_delta') {
            const px0 = xAxis.getPixelForValue(state.t0);
            const px1 = xAxis.getPixelForValue(state.t1);
            const py0 = yAxis.getPixelForValue(state.y0);
            const py1 = yAxis.getPixelForValue(state.y1);
            const X0 = xAxis.getPixelForValue(0);
            const Y0 = yAxis.getPixelForValue(0);
            
            ctx.save();
            ctx.lineWidth = 8;
            ctx.strokeStyle = (DM ? '#FFF5' : '#00000055');
            ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.stroke();
            ctx.lineWidth = 2;
            ctx.setLineDash([5,5]);
            if (state.prikaziDy) {
                ctx.strokeStyle = '#dc2626';
                ctx.beginPath(); ctx.moveTo(X0, py0); ctx.lineTo(px0, py0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(X0, py1); ctx.lineTo(px1, py1); ctx.stroke();
            }
            if (state.prikaziDx) {
                ctx.strokeStyle = '#2563eb';
                ctx.beginPath(); ctx.moveTo(px0, Y0); ctx.lineTo(px0, py0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px1, Y0); ctx.lineTo(px1, py1); ctx.stroke();
            }
            ctx.restore();
            
            if (state.prikaziDx) { 
                //crtajStrelicu(px0, py0, px1, py0, '#2563eb', [
                //    { t: 'Δ', i: false }, { t: 't', i: true }, { t: ` = ${state.t1 - state.t0} s`, i: false }
                //]);
                crtajStrelicu(px0, Y0, px1, Y0, '#2563eb', [
                    { t: 'Δ', i: false }, { t: 't', i: true }, { t: ` = ${state.t1 - state.t0} s`, i: false }], { pocetna: state.t0, krajnja: state.t1 }
                );
            }
            if (state.prikaziDy) {
                const startX = state.prikaziDx ? px1 : px0;
                const oznakaSlovo = state.vrstaGrafa === 's/t' ? 's' : 'v';
                const mjernaJedi = state.vrstaGrafa === 's/t' ? 'm' : 'm/s';
                //crtajStrelicu(startX, py0, startX, py1, '#dc2626', [
                //    { t: 'Δ', i: false }, { t: oznakaSlovo, i: true }, { t: ` = ${state.y1 - state.y0} ${mjernaJedi}`, i: false }
                //]);
                crtajStrelicu(X0, py0, X0, py1, '#dc2626', [
                    { t: 'Δ', i: false }, { t: oznakaSlovo, i: true }, { t: ` = ${(state.y1 - state.y0).toString().replace('-', '–')} ${mjernaJedi}`, i: false }], { pocetna: state.y0, krajnja: state.y1 }
                );
            }
        }
        
        if (state.tip === 'sve_delte' ) {
            let faze = trenutniZadatak.faze;
            for (let i=0; i<=2; i++) {
                if (faze[i].y0 !== faze[i].y1) {   // ima pomaka
                    const px0 = xAxis.getPixelForValue(faze[i].t0);
                    const px1 = xAxis.getPixelForValue(faze[i].t1);
                    const py0 = yAxis.getPixelForValue(faze[i].y0);
                    const py1 = yAxis.getPixelForValue(faze[i].y1);
                    
                    ctx.save();
                    ctx.setLineDash([6, 4]);
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px1, py1); ctx.strokeStyle = '#dc2626'; 
                    ctx.stroke();
                    ctx.restore();
                    
                    crtajStrelicu(px0, py0, px0, py1, '#dc2626', [
                     { t: ` ${Math.abs(faze[i].y0 - faze[i].y1).toString()} m`, i: false }], { pocetna: faze[i].y0, krajnja: faze[i].y1 }
                    );

        if (state.tip === 'usporedi_nagibe') {
            let faze = trenutniZadatak.faze;

            for (let i=0; i<=2; i++) {

                const px1 = xAxis.getPixelForValue(faze[i].t0+1);
                const py0 = yAxis.getPixelForValue(faze[i].y0);
                const py1 = yAxis.getPixelForValue(faze[i].y0 + (faze[i].y1-faze[i].y0)/(faze[i].t1-faze[i].t0));
                ctx.beginPath();
                ctx.fillStyle='#FF000055';
                
                ctx.moveTo(px0,py0);
                ctx.lineTo(px1,py0);
                ctx.lineTo(px1,py1);
                ctx.lineTo(px0,py0);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.strokeStyle='#FF0000';

                ctx.moveTo(px1,py0);
                ctx.lineTo(px1,py1);

            }
            ctx.restore();

        if (state.tip === 'povrsina') {
            nacrtajPovrsinu(state.t0,state.t1,state.y0,state.y1);

        if (state.tip === 'povrsina-sve') {
            for (let i=0;i<=2;i++) {
                let f = trenutniZadatak.faze[i];
                nacrtajPovrsinu(f.t0,f.t1,f.y0,f.y1);
            }
        }
        
        function nacrtajPovrsinu(t0,t1,y0,y1) {
            if(!y0 && !y1) return;
            
            const px0 = xAxis.getPixelForValue(t0);
            const px1 = xAxis.getPixelForValue(t1);
            const py0 = yAxis.getPixelForValue(y0);
            const py1 = yAxis.getPixelForValue(y1);
            const p0 = yAxis.getPixelForValue(0);
            const y = Math.abs(y0)<Math.abs(y1) ? y0 : y1;  // y koordinata stranice kvadra 
            const py = yAxis.getPixelForValue(y);
            ctx.globalAlpha = 0.3;
            let dxOznacen = 0;
            
            // pozadina
            if (y0 && y1) {   // PRAVOKUTNIK  (postoji ako su oba y razlicita od 0)
                if (y >= 0) ctx.fillStyle = '#79DB1A'; else ctx.fillStyle = '#B51CE3';
                ctx.fillRect(px0, Math.min(py, p0), px1 - px0, Math.abs(py - p0));
                ctx.globalAlpha = 1;
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(px0, p0);
                ctx.lineTo(px0, py0);
                ctx.moveTo(px1, p0);
                ctx.lineTo(px1, py1);
                ctx.moveTo(px0, py);
                ctx.lineTo(px1, py);
                ctx.stroke();
                //ctx.setLineDash([]);
                ctx.restore();
            }
            if (y0 !== y1) {    // TROKUT  (ako postoji delta_y)
                ctx.fillStyle = '#cccc0066'; 
                ctx.beginPath(); 
                ctx.moveTo(px0, py); 
                ctx.lineTo(px0, py0);
                ctx.lineTo(px1, py1);
                ctx.lineTo(px1, py);
                //ctx.lineTo(px0+2, py0-2);
                ctx.closePath(); 
                ctx.fill();
                
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(px0, py0);
                ctx.lineTo(px0, py1);
                ctx.lineTo(px1, py1);
                //ctx.moveTo(px0, py);
                //ctx.lineTo(px1, py);
                ctx.stroke();
                //ctx.setLineDash([]);
                ctx.restore();
            }
            
            // oznake
            ctx.globalAlpha = 1;
            
            if (y0 && y1) {   // PRAVOKUTNIK  (postoji ako su oba y razlicita od 0)
                crtajDiskSVrijednosti((px0+px1)/2,py,'#000000aa','');
                crtajDiskSVrijednosti(px0,(py0+p0)/2,'#000000aa','');
                crtajDiskSVrijednosti((px0+px1)/2,(py0+p0)/2,'#000',20);
                
                dopisiYVrijednost((px0+px1)/2,py,'#000','×'+(t1-t0));
                dopisiYVrijednost(px0,(py0+p0)/2,'#000',Math.abs(y));
                dopisiYVrijednost((px0+px1)/2,(py0+p0)/2,'#000','= '+Math.abs(y)*(t1-t0));
                
                dxOznacen = 1;  // da ne dupliciramo za trokut, ako postoji
            }
            if (y0 !== y1) {    // TROKUT  (ako postoji delta_y)
                const minV = Math.min(y0, y1);
                const pMinV = yAxis.getPixelForValue(minV);
                
                if (!dxOznacen) 
                    crtajDiskSVrijednosti((px0+px1)/2,py,'#000000aa','');
                crtajDiskSVrijednosti(px0,(py0+py1)/2,'#000000aa','');
                crtajDiskSVrijednosti((px0+px1)/2-20,(py0+py1)/2-20,'#F00',12);
                crtajDiskSVrijednosti((px0+px1)/2,(py0+py1)/2,'#000',20);
                
                if (!dxOznacen) 
                    dopisiYVrijednost((px0+px1)/2,py,'#000','×'+(t1-t0));
                dopisiYVrijednost(px0,(py0+py1)/2,'#000',Math.abs(y0-y1));
                dopisiYVrijednost((px0+px1)/2-20,(py0+py1)/2-20,'','/ 2');
                dopisiYVrijednost((px0+px1)/2,(py0+py1)/2,'#000','= '+Math.abs(y1-y0)*(t1-t0)/2);
            }
                
        }

        ctx.restore();
    }
};

function nacrtajOznakeFaza(chart) {
    if (!trenutniZadatak || oznaciDio > 4) return;
    const ctx = chart.ctx;
    const xAxis = chart.scales.x;
    const yAxis = chart.scales.y;
    
    ctx.save();
    
    ctx.font = 'bold 50px sans-serif';
    
    trenutniZadatak.faze.forEach((faza, indeks) => {
        const tSredina = (faza.t0 + faza.t1) / 2;
        if (trenutniZadatak.vrstaGrafa === 's/t-krivo') {
        const dt = tSredina - faza.t0;
            ySredina = faza.kinematika.s0 + faza.kinematika.v0 * dt + 0.5 * faza.kinematika.a * dt * dt;
        } else {
            ySredina = (faza.y0 + faza.y1) / 2;
        }  
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const px = xAxis.getPixelForValue(tSredina) - 0;
        const py = yAxis.getPixelForValue(ySredina) - 0; 
        if(indeks == oznaciDio) { 
            ctx.fillStyle = (DM ? '#26FB' : '#083eaaCC'); 
            ctx.fillText(`${indeks + 1}`, px, py);
        } else { 
            ctx.fillStyle = (DM ? '#ffffff44' : '#00000055'); 
            ctx.fillText(`${indeks + 1}`, px, py);
        }
        
    });
    ctx.restore();
}

const simulacijaPlugin = {
    id: 'simulacijaLinija',
    afterDraw: (chart) => {
        if (!isSimulacijaAktivna || trenutnoVrijemeSimulacije === null) return;
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;
        
        const xPos = xAxis.getPixelForValue(trenutnoVrijemeSimulacije);
        
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(xPos, yAxis.top);
        ctx.lineTo(xPos, yAxis.bottom);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'red';
        ctx.stroke();
        ctx.restore();
    }
};

function prikaziGraf(zadatak) {
    const ctx = document.getElementById('gibanjaChart').getContext('2d');
    let chartData = [];
    
    if (zadatak.vrstaGrafa === 's/t-krivo') {
        const N = 20; // broj točaka po fazi za glatku krivulju
        zadatak.faze.forEach(f => {
            const dt = f.t1 - f.t0;
            for (let i = 0; i <= N; i++) {
                const t = (i / N) * dt;
                const s = f.kinematika.s0 + f.kinematika.v0 * t + 0.5 * f.kinematika.a * t * t;
                chartData.push({ x: f.t0 + t, y: s, isKraj: (i === 0 || i === N) });
            }
        });
    } else if (zadatak.vrstaGrafa === 'v/t' && zadatak.gradivo === 'jednoliko') {
        zadatak.faze.forEach((f, i) => {
            if (i === 0) chartData.push({ x: f.t0, y: f.y0 });
            chartData.push({ x: f.t1, y: f.y0 });
            if (i < 2) chartData.push({ x: f.t1, y: zadatak.faze[i+1].y0 });
        });
    } else if (zadatak.vrstaGrafa === 'a/t') {
        zadatak.faze.forEach((f, i) => {
            if (i === 0) chartData.push({ x: f.t0, y: f.y0 });
            chartData.push({ x: f.t1, y: f.y0 });
            if (i < 2) chartData.push({ x: f.t1, y: zadatak.faze[i+1].y0 });
        });
    } else {
        chartData.push({ x: zadatak.faze[0].t0, y: zadatak.faze[0].y0 });
        zadatak.faze.forEach(f => chartData.push({ x: f.t1, y: f.y1 }));
    }
    
    let referentniData = [];
    if (zadatak.vrstaGrafa === 's/t-krivo') {
        referentniData.push({ x: zadatak.faze[0].t0, y: zadatak.faze[0].kinematika.s0 });
        zadatak.faze.forEach(f => referentniData.push({ x: f.t1, y: f.kinematika.s1 }));
    }

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: `Graf ${zadatak.vrstaGrafa}`,
                data: chartData,
                borderColor: (DM ? '#ffffff' : '#000000'),
                borderWidth: 3,
                pointRadius: (ctx) => (ctx.raw && ctx.raw.isKraj === false) ? 0 : 4,
                pointBackgroundColor: (DM ? '#ffffff' : '#000000'),
                fill: false,
                tension: 0,
                clip: false,
                segment: {
                    borderColor: (ctx) => (ctx.p0.parsed.x === ctx.p1.parsed.x) ? (DM ? '#ffffffaa' : '#00000033') : (DM ? '#ffffffaa' : '#000000')
                }
            },
            {
                data: referentniData,
                borderColor: (DM ? '#ffffff77' : '#00000055'),
                borderWidth: 1.5,
                borderDash: [6, 4],
                pointRadius: 0,
                fill: false,
                tension: 0,
                clip: false,
                order: 2   // crta se ispod/prije glavne linije
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 40, right: 35, left: 10, bottom: 22 } },
            scales: {
                x: {
                    type: 'linear',
                    border: { display: false },
                    ticks: { display: false, stepSize: 1, precision: 0 },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'transparent' : (DM ? '#ffffff33' : '#00000022') },
                    min: 0,
                    max: zadatak.faze[2].t1
                },
                y: {
                    border: { display: false },
                    ticks: { stepSize: 1, precision: 0, color: (DM ? '#fff' : '#000') },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'transparent' : (DM ? '#ffffff33' : '#00000022') },
                    beginAtZero: true
                }
            },
            plugins: { 
                legend: { display: false }, 
                minimalnaOs: false 
            }
        }
    });
}


function izracunajTockeZaGraf(faze, vrsta, brojTocaka = 50) {
   
    //const jeStepGraf = (vrsta === 'a/t') || (vrsta === 'v/t' && faze.every(f => f.y0 === f.y1));
    // "Step" grafovi: a/t je uvijek "step" (akceleracija konstantna po fazi); v/t je "step"
    // točno kad je akceleracija 0 u svakoj fazi (konstantna brzina, mogući skok na granici).
    // Provjera ide preko f.kinematika.a (uvijek fizikalno točno), NE preko f.y0/f.y1 -
    // ta polja imaju značenje ORIGINALNOG vrstaGrafa kojim su faze generirane, što se
    // može razlikovati od ciljanog 'vrsta' parametra ovdje (npr. kod tezina-7 kandidata).
    const jeStepGraf = (vrsta === 'a/t') || (vrsta === 'v/t' && faze.every(f => Math.abs(f.kinematika.a) < 1e-9));
    
    
    if (jeStepGraf) {
        const tocke = [];
        faze.forEach((f, i) => {
            const y = (vrsta === 'a/t') ? f.kinematika.a : f.kinematika.v0;
            if (i === 0) tocke.push({ x: f.t0, y });
            tocke.push({ x: f.t1, y });
            if (i < faze.length - 1) {
                const yNext = (vrsta === 'a/t') ? faze[i + 1].kinematika.a : faze[i + 1].kinematika.v0;
                tocke.push({ x: f.t1, y: yNext });
            }
        });
        return tocke;
    }

    // Ostali (glatki, kontinuirani) grafovi - gusto uzorkovanje kao dosad
    const tMax = faze[faze.length - 1].t1;
    const tocke = [];
    for (let i = 0; i < brojTocaka; i++) {
        const t = (tMax * i) / (brojTocaka - 1);
        let faza = faze.find(f => t >= f.t0 && t <= f.t1) || faze[faze.length - 1];
        const dt = t - faza.t0;
        const { s0, v0, a } = faza.kinematika;
        const y = (vrsta === 's/t') ? (s0 + v0 * dt + 0.5 * a * dt * dt) : (v0 + a * dt);
        tocke.push({ x: t, y: y });
    }
    return tocke;
}


function nacrtajMiniGraf(canvasId, zadatak, vrsta) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    const podaci = izracunajTockeZaGraf(zadatak.faze, vrsta);
    const simbolY = vrsta === 's/t' ? 's' : (vrsta === 'v/t' ? 'v' : 'a');
    const jedinicaY = vrsta === 's/t' ? '(m)' : (vrsta === 'v/t' ? '(m/s)' : '(m/s²)');

    let natpis = '';
    let natpis2 = '';
    
    if(simbolY === 's') natpis = 'v = nagib!';
    if(simbolY === 'a' && (gradivoSelect.value === 'jednoliko' || zadatak.vrstaGrafa === 's/t') ) natpis2 = "NEFIZIKALNO!";
    else if(simbolY === 'v' && zadatak.gradivo === 'sva') natpis = 'a = nagib!';
    
    
    return new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: `Graf ${vrsta}`,
                data: podaci,
                borderColor: (DM ? '#ffffffaa' : '#000000'),
                borderWidth: 4,
                pointRadius: 0,
                fill: false,
                tension: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 20, right: 32, left: 5, bottom: 30 } },
            scales: {
                x: {
                    type: 'linear',
                    border: { display: false },
                    ticks: { display: false, stepSize: 1, precision: 0 },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'transparent' :  (DM ? '#ffffff33' : '#00000022')},
                    min: 0,
                    max: zadatak.faze[2].t1
                },
                y: {
                    border: { display: false },
                    ticks: { stepSize: 1, precision: 0 },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'transparent' : (DM ? '#ffffff33' : '#00000022') },
                    beginAtZero: true
                }
            },
            plugins: {
                legend: { display: false },
                // Školska os (linije s strelicama) se crta i ovdje, ali s ispravnim nazivom
                // veličine za ovaj mini-graf. Crvena simulacijska linija ostaje uključena
                // (ažurira se posebno), a oznake faza se isključuju jer su vezane isključivo
                // uz podatke glavnog grafa.
                skolskaOs: { 
                    simbol: simbolY, 
                    jedinica: jedinicaY,
                    tekstSredina: natpis2,
                    tekstDno: natpis,
                    kompaktan: true
                },
                vizualniAsistent: false,
                minimalnaOs: false
            }
        }
    });
}

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(array) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const seed = today.getTime() % 2147483647;

  const rng = mulberry32(seed);
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function zaustaviSimulaciju() {
    isSimulacijaAktivna = false;
    trenutnoVrijemeSimulacije = null;
    akceleracijaStrelica.style.opacity=0;
 
    if (animacijaFrameId) cancelAnimationFrame(animacijaFrameId);
    if (chartInstance) chartInstance.update();
    ostaliChartInstances.forEach(c => { if (c) c.update(); });
    document.querySelectorAll('.sakrij').forEach(el => {
        el.style.opacity = '1';
    });
}

function pokreniAnimaciju() {
    const ukupnoVrijeme = trenutniZadatak.faze[2].t1;
    let startVrijeme = performance.now();
    akceleracijaStrelica.style.opacity=1;

    
    document.querySelectorAll('.sakrij').forEach(el => {
        el.style.opacity = '0.65';
    });
    
    function loop(vrijeme) {
        if (!isSimulacijaAktivna) return;
        
        // Real-time protekle sekunde s beskonačnom petljom (loop)
        let proteklo = (vrijeme - startVrijeme) / 1000;
        trenutnoVrijemeSimulacije = proteklo % ukupnoVrijeme;
        
        azurirajAuto(trenutnoVrijemeSimulacije);
        azurirajTockice(trenutnoVrijemeSimulacije);
        chartInstance.update('none'); // Ažuriraj bez animiranja cijelog grafa
        if (prikazaniDodatniGrafovi) {
            ostaliChartInstances.forEach(c => { if (c) c.update('none'); });
        }
        
        animacijaFrameId = requestAnimationFrame(loop);
    }
    animacijaFrameId = requestAnimationFrame(loop);
}

// Izračunava trenutni položaj (u %) i brzinu za dano vrijeme t, koristeći
// pred-izračunatu kinematiku po fazama. Koristi se i za auto/brzinomjer i za točkice traga.
function izracunajStanjeGibanja(t) {
    const faze = trenutniZadatak.faze;
    let aktivnaFaza = faze.find(f => t >= f.t0 && t <= f.t1) || faze[faze.length - 1];

    let dt = t - aktivnaFaza.t0;
    const { s0, v0, a } = aktivnaFaza.kinematika;
    let polozaj = s0 + v0 * dt + 0.5 * a * dt * dt;
    let brzina = v0 + a * dt;

    const { minS, maxS } = trenutniZadatak.simulacijaProps;
    let postotak = ((polozaj - minS) / (maxS - minS)) * 100;

    return { postotak, brzina, akceleracija: a };
}


const TRAKA_NAPRIJED_AUTO = isMobile ? 74 : 74;
const TRAKA_NAZAD_AUTO = isMobile ? 66 : 66;
const TRAKA_NAPRIJED_TOCKICA = 75;
const TRAKA_NAZAD_TOCKICA = 25;
const MAX_DULJINA_STRELICE_AKC = 50;


function azurirajAuto(t) {
    if (!trenutniZadatak) return;
    
    const { postotak, brzina, akceleracija } = izracunajStanjeGibanja(t);
    const traka = brzina < 0 ? TRAKA_NAZAD_AUTO : TRAKA_NAPRIJED_AUTO;
            const strelica = traka + 2;

    gibAuto.style.left = `${postotak}%`;
    gibAuto.style.top = `${traka}%`;
    gibBrzinomjerSloj.style.left = `${postotak}%`;
    papirPolozaj.style.left = `${2+postotak*0.96}%`;
    
    azurirajBrzinomjer(brzina, trenutniZadatak.simulacijaProps.maxBrzina);

    akceleracijaStrelica.style.left = `${postotak}%`;
    akceleracijaStrelica.style.top = `${strelica}%`;
    azurirajStrelicuAkceleracije(akceleracija, trenutniZadatak.simulacijaProps.maxAkceleracija);
}

    function azurirajStrelicuAkceleracije(akceleracija, maxAkceleracija) {
            const duljina = (Math.abs(akceleracija) / maxAkceleracija) * MAX_DULJINA_STRELICE_AKC+20;
            const smjer = akceleracija >= 0 ? 1 : -1;
            const vrhX = 100 + smjer * duljina;

            if(!isSimulacijaAktivna || akceleracija == 0) {
                akceleracijaStrelica.style.opacity = 0;
            } else {
                akceleracijaStrelica.style.opacity = 1;
            }
            
            // Osiguraj da linija nema polukružni izbočaj koji strši izvan vrha
            akcLinija.setAttribute('stroke-linecap', 'butt');

            if (duljina < 1) {
                    // Kada je akceleracija 0, linija i vrh se skupljaju u sredinu
                    akcLinija.setAttribute('x2', 100);
                    akcVrh.setAttribute('points', `${vrhX},10 ${vrhX},10 ${vrhX},10`);
            } else {
                    // Vrh strelice je dug 10px
                    const nazad = vrhX - smjer * 10;

                    // Ključna izmjena: linija završava na bazi trokuta (nazad), a ne u vrhu (vrhX)
                    akcLinija.setAttribute('x2', nazad);
                    akcVrh.setAttribute('points', `${vrhX},10 ${nazad},6 ${nazad},14`);
                    akcOznaka.setAttribute('x', vrhX);
            }
    }

function azurirajBrzinomjer(brzina, maxBrzina) {
    const apsBrzina = Math.min(Math.abs(brzina), maxBrzina);

    // 0 => kazaljka vodoravno lijevo, maxBrzina => kazaljka vodoravno desno,
    // prolazeći kroz vrh kruga za polovicu maksimuma.
    const kutRad = Math.PI * (1 - apsBrzina / maxBrzina);
    const cx = 50, cy = 50, r = 40;
    const vrhX = cx + r * Math.cos(kutRad);
    const vrhY = cy - r * Math.sin(kutRad);

    gibBrzinomjerKazaljka.setAttribute('x2', vrhX.toFixed(2));
    gibBrzinomjerKazaljka.setAttribute('y2', vrhY.toFixed(2));
   
}

function ocistiTockice() {
    papirTraka.querySelectorAll('.tockica-gibanja').forEach(el => el.remove());
    tockiceDodane = new Set();
}

function azurirajTockice(t) {
    const idx = Math.floor(t / 0.2 + 1e-9);
    if (tockiceDodane.has(idx)) return;
    tockiceDodane.add(idx);
    const { postotak, brzina } = izracunajStanjeGibanja(idx * 0.2);
    dodajTockicu(postotak, brzina);
}
